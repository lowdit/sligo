{{ define "main" }}
  {{- if templates.Exists "partials/lowdit/resolve-view.html" -}}
    {{ partial "home/slides-showcase.html" . }}
  {{- else -}}
    <article class="sligo-home-stub">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
      <div>{{ .Content }}</div>
    </article>
  {{- end -}}
{{ end }}
