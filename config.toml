[module]
  [module.hugoVersion]
    extended = true
    min = "0.145.0"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
enableInlineShortcodes = true
removePathAccents = true

[pagination]
  disableAliases = false
  pagerSize = 20
  path = 'page'

[markup.goldmark.renderer]
  unsafe = true

[frontmatter]
  _merge = 'deep'
[outputformats]
  _merge = 'deep'
[outputs]
  _merge = 'deep'

[outputFormats.presentation]
  baseName = "presentation"
  isHTML = true
  mediaType = "text/html"
  notAlternative = false
  permalinkable = true

[[cascade]]
  _merge = 'deep'
  # Une publication = un source → deux vues (article HTML + deck).
  # NB : Hugo n'applique pas la cascade déclarée dans la config d'un thème/module ;
  # les sites consommateurs la déclarent aussi dans leur propre config
  # (voir docs/PUBLICATIONS.md § 5).
  outputs = ['HTML', 'presentation']
  [cascade.target]
    path = '/publication/**'